# 이미 나간 릴리스를 크롬 웹스토어에 올린다.
#
# **다시 빌드하지 않는다.** 그 태그의 릴리스에 이미 붙어 있는 zip 을 그대로 받아
# 올리므로, 스토어에 올라가는 바이트가 사람들이 받은 zip 과 같은 파일이다.
# 스토어만 실패했을 때 새 태그를 파는 것은 과하다 — 코드가 안 바뀌었는데 버전만
# 올라가고, 사용자가 받은 zip 과 스토어 버전이 어긋난다.
#
# **아직 이 확장은 스토어에 없다.** 그래서 확장 ID 를 코드에 박지 않고 시크릿에서
# 받는다. 첫 등록은 대시보드에서 손으로 해야 하고 — 스토어는 새 항목을 API 로
# 만들게 해주지 않는다 — 그때 받은 ID 를 `CWS_EXTENSION_ID` 로 넣으면 그 뒤의
# 갱신은 여기서 돈다.
#
# 시크릿 넷이 필요하다.
#   CWS_EXTENSION_ID · CWS_CLIENT_ID · CWS_CLIENT_SECRET · CWS_REFRESH_TOKEN

name: store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '올릴 릴리스 태그 (예: v0.7.6)'
        required: true
        type: string
      publish:
        description: '심사 제출까지 한다 (끄면 초안으로만 올린다)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 릴리스에 붙어 있는 자산을 그대로 받는다. 이름은 release.yml 이 정한
      # 규칙 — 태그의 점을 언더바로 바꾼 것 — 을 따른다.
      - name: 릴리스 zip 받기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          v="$(printf '%s' "$TAG" | tr '.' '_')"
          asset="oc-easy-mode-$v.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          ls -lh "$asset"
          unzip -l "$asset"
          # 스토어가 거절하는 것을 여기서 먼저 잡는다. 예약된 `_` 이름이 들어간
          # 패키지는 업로드는 되고 심사에서 죽는다.
          ! unzip -l "$asset" | grep -E ' _' | grep -v '_locales' | grep . || {
            echo "::error::예약된 _ 이름이 $asset 에 들어 있습니다"; exit 1; }
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: 크롬 웹스토어에 올린다
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          for name in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            eval "value=\$$name"
            [ -n "$value" ] || {
              echo "::error::시크릿이 없습니다 — CWS_$name"; exit 1; }
          done
          # 여기는 실패하면 실패다. 이 잡의 유일한 일이 스토어에 올리는 것이라,
          # 초록으로 끝나면 거짓말이 된다.
          #
          # `[ … ] && args+=(…)` 로 쓰면 안 된다. 기본 셸이 `bash -e` 라 조건이
          # 거짓일 때 그 줄의 종료 코드 1 이 그대로 스텝 실패가 된다.
          args=(upload --source "$ASSET")
          if [ "${{ inputs.publish }}" = "true" ]; then
            args+=(--auto-publish)
          fi
          npx --yes chrome-webstore-upload-cli@3 "${args[@]}"
          echo "✅ \`${{ inputs.tag }}\` 를 크롬 웹스토어에 올렸습니다 (publish=${{ inputs.publish }})" >> "$GITHUB_STEP_SUMMARY"
