# site/ 를 GitHub Pages 로 올린다 — https://jshsakura.github.io/renewtube/
#
# **여기서 직접 빌드해서 zip 을 함께 올린다.** 형제 저장소(oc-youtube-music)는
# 일부러 반대로 한다 — 거기서는 다운로드 버튼이 최신 릴리스의 자산을 그대로
# 복사하고, 페이지가 릴리스와 다른 물건을 조용히 내주는 일을 막는다.
#
# 이 저장소는 릴리스를 만들지 않는다. 스토어에 올리지 않는 개인용이고, 받는
# 사람은 "지금 main 에 있는 것"을 원한다. 그러면 복사할 릴리스가 없으므로 그
# 방식은 첫 배포부터 빈 다운로드 디렉터리를 배포하게 된다. 여기서 빌드하면
# 페이지가 내주는 것이 곧 main 이고, 어긋날 두 가지가 애초에 없다.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 두 배포가 겹치지 않게. 다만 진행 중인 것을 죽이지는 않는다 —
# 반쯤 올라간 사이트가 조금 늦은 사이트보다 나쁘다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: 사이트를 조립하고 패키지를 넣는다
        run: |
          set -e
          mkdir -p _site/download
          cp -R site/. _site/

          version=$(node -p "require('./package.json').version")
          name="renewtube-$version.zip"

          # dist/ 안에서 압축한다. 최상위가 dist 폴더인 zip 은 manifest 없는
          # 확장으로 읽히고, 브라우저는 그 이유도 고칠 방법도 알려주지 않는다.
          (cd dist && zip -qr "../_site/download/$name" .)

          size=$(stat -c%s "_site/download/$name")
          # 페이지가 자기 다운로드 버튼의 주소를 여기서 읽는다.
          # scripts/site.mjs 가 로컬에서 쓰는 것과 같은 파일이라,
          # 로컬 확인이 배포된 페이지의 미리보기가 아니라 같은 것이 된다.
          printf '{\n "name": "%s",\n "size": %s,\n "version": "%s"\n}\n' \
            "$name" "$size" "$version" > _site/download/index.json
          cat _site/download/index.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
